# tmux 跨機共用設定範本（手動抄寫，非自動部署）
# 用法：在每台機器的 ~/.tmux.conf 加入以下內容，存檔後 reload：
#   tmux source-file ~/.tmux.conf      （沒開 tmux 的話下次開自動生效）

# --- prefix 改 C-a（取代預設 C-b）---
# 想送字面 Ctrl-a 給 shell（跳行首）時：連按兩次 C-a（send-prefix）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- 一鍵切換 session/window（不用 prefix，免疫中文輸入法）---
# 痛點：prefix(C-a) 後面那個裸字母鍵（如 w）會被中文輸入法吃進組字區 → 靜默失敗。
#       用單一 Ctrl 組合鍵直達：Ctrl 修飾鍵不被輸入法攔，中文開著也通。
# 為何 C-\：原想用 C-o，但 Claude Code 佔用 Ctrl+o（要留給它）；C-\ 在 claude / mac 版
#          VS Code 都沒被佔，且 Ctrl 系免疫輸入法。注意 tmux.conf 反斜線要寫兩個（C-\\）。
bind -n C-\\ choose-tree -Zw
