# tmux 跨機共用設定範本（手動抄寫，非自動部署）
# 用法：在每台機器的 ~/.tmux.conf 加入以下內容，存檔後 reload：
#   tmux source-file ~/.tmux.conf      （沒開 tmux 的話下次開自動生效）

# --- prefix 改 C-a（取代預設 C-b）---
# 想送字面 Ctrl-a 給 shell（跳行首）時：連按兩次 C-a（send-prefix）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- 切換 session/window：prefix → Ctrl+w（免疫中文輸入法、VS Code 終端可用）---
# 痛點：prefix(C-a) 後按裸字母 w 會被中文輸入法吃進組字區 → 靜默失敗、按半天沒反應。
# 踩坑史（2026-06-29 Air）：先試無-prefix 單鍵 C-o → 撞 Claude Code（佔 Ctrl+o）；
#   改 C-\ → 在 VS Code 內建終端裡 VS Code 自己吃掉單鍵、到不了 tmux。結論：
#   VS Code 終端內，無-prefix 單鍵不可靠。改回 prefix 開頭：prefix(C-a) 確定會過，
#   第二鍵用 Ctrl+w（標準 ^W、VS Code 放行、輸入法不吃）→ 全環境（含 VS Code / 原生終端 / SSH）可用。
# 用法：Ctrl+a 放開，再 Ctrl+w。（原生終端 / SSH 若想要真單鍵，可另在該機加 bind -n。）
# reload 時明確移除舊版全域 C-\ 綁定；只刪設定行不會清掉已運行 server 的既有 key table。
unbind -n C-\\
bind C-w choose-tree -Zw
