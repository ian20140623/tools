# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  # Dropbox 架構的初次安裝 seed；日常修改請改 Dropbox/espanso/base.yml。
  # ── 自訂縮寫（跨機共用；2026-06-18 Air 加 tmux/cd 系列）──
  - trigger: "cl;"
    replace: "claude"

  - trigger: "tmls;"
    replace: "tmux ls"

  - trigger: "tmat;"
    replace: "tmux attach -t "

  - trigger: "tmne;"
    replace: "tmux new -s "

  - trigger: "tmre;"
    replace: "tmux rename-session -t "

  - trigger: "tmki;"
    replace: "tmux kill-session -t "

  - trigger: "cdjp;"
    replace: "cd ~/Projects"

  - trigger: "proj;"
    replace: "projects"

  - trigger: "cdpj;"
    replace: "cd ~/Projects"

  # knowledge-system 與 knowledge-system-warm-backup 的自動縮寫撞名，明確指定主 repo。
  - trigger: "know;"
    replace: "knowledge-system"

  - trigger: "cdknow;"
    replace: "cd ~/Projects/knowledge-system"

  - trigger: "obs;"
    replace: "Obsidian"

  # ── espanso 預設範例（保留）──
  # Simple text replacement
  - trigger: ":espanso"
    replace: "Hi there!"

  # NOTE: espanso uses YAML to define matches, so pay attention to the indentation!

  # Print the current date
  - trigger: ":date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%m/%d/%Y"

  # And much more! For more information, visit the docs: https://espanso.org/docs/
